{% include base_path %}

<!-- start custom head snippets -->

<!-- Inter: one variable file covers every weight the site uses, so the
     whole type scale arrives in a single request. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..800;1,14..32,300..800&display=swap">

<link rel="icon" href="{{ base_path }}/images/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="{{ base_path }}/images/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="{{ base_path }}/images/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon.png">
<link rel="manifest" href="{{ base_path }}/images/site.webmanifest">
<meta name="theme-color" content="#f0f8f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#242324" media="(prefers-color-scheme: dark)">

<script src="//d3js.org/d3.v3.min.js"></script>
<script>
function hideBlock(id) {
  document.getElementById(id).style.display = 'none';
}
function showBlock(id) {
  document.getElementById(id).style.display = 'block';
}
</script>

<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<script type="text/x-mathjax-config"> MathJax.Hub.Config({ TeX: { equationNumbers: { autoNumber: "all" } } }); </script>
<script type="text/x-mathjax-config">
  MathJax.Hub.Config({
    tex2jax: {
      inlineMath: [ ['$','$'], ["\\(","\\)"] ],
      processEscapes: true
    }
  });
</script>
<script src='https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.4/latest.js?config=TeX-MML-AM_CHTML' async></script>

<!-- end custom head snippets -->
