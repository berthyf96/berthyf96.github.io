# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve`. If you change this file, please restart the server process.

# Site Settings
locale                   : "en-US"
title                    : "Berthy Feng"
title_separator          : "-"
name                     : "Berthy Feng"
description              : "Postdoctoral Fellow @ MIT"
url                      : https://www.berthyfeng.com # the base hostname & protocol for your site
baseurl                  : "" # the subpath of your site, e.g. "/blog"
repository               : "berthyf96.github.io"
atom_feed:
  path                   : # blank (default) uses feed.xml


# Site Author
author:
  name             : "Berthy Feng"
  avatar           : "profile.png"
  bio              : "Postdoctoral Fellow @ MIT"
  location         : "Cambridge, MA"
  email            : berthy@mit.edu
  github           : "berthyf96"
  # googlescholar  :
  # orcid          :
  # linkedin       :


# Reading Files
include:
  - _pages
  - files
exclude:
  - .bundle
  - .sass-cache
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - assets/js/plugins
  - assets/js/vendor
  - node_modules
  - package.json
  - vendor
keep_files:
  - .git
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# Defaults
defaults:
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true


# Outputting
timezone: America/New_York # http://en.wikipedia.org/wiki/List_of_tz_database_time_zones


# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-feed
# mimic GitHub Pages with --safe
whitelist:
  - jekyll-sitemap
  - jekyll-feed


# HTML Compression
# - http://jch.penibelst.de/
compress_html:
  clippings: all
  ignore:
    envs: development
